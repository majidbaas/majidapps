        max-width: 700px;
        margin: 100px auto 40px;
        text-align: center;
        padding: 50px 30px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .welcome-icon {
        font-size: 55px;
        margin-bottom: 20px;
    }

    .home-welcome h1 {

        color: #17324d;
    }

    .welcome-subtitle {

        background: #0d6efd;
